name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: bash ./gradlew :app:testFdroidDebugUnitTest
      - name: Debug build
        run: bash ./gradlew :app:assembleFdroidDebug
      - name: Android lint
        run: bash ./gradlew :app:lintFdroidDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airchat-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
